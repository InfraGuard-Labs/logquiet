name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-and-vet:
    name: Format & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  fuzz-smoke:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz normalize.Template
        run: go test ./internal/normalize/ -run=^$ -fuzz=FuzzTemplate -fuzztime=20s
      - name: Fuzz severity.Detect
        run: go test ./internal/severity/ -run=^$ -fuzz=FuzzDetect -fuzztime=20s
      - name: Fuzz multiline.Assembler
        run: go test ./internal/multiline/ -run=^$ -fuzz=FuzzAssembler -fuzztime=20s

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  correctness:
    name: Correctness benchmark (retention)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./tools/fixturegen correctness
      - run: go run ./benchmarks/correctness --json /tmp/correctness.json
      - uses: actions/upload-artifact@v4
        with:
          name: correctness-results
          path: /tmp/correctness.json

  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate a small perf corpus and run it once
        run: |
          go build -o logquiet ./cmd/logquiet
          go run ./tools/fixturegen perf 50000 mixed /tmp/smoke.log
          ./logquiet --plain --stats /tmp/smoke.log > /dev/null
      - name: Run micro-benchmarks (compile + smoke-run only, not timed in CI)
        run: |
          go test ./internal/normalize/ -bench=. -benchtime=1x -run=^$
          go test ./internal/pipeline/ -bench=. -benchtime=1x -run=^$

  build-all-platforms:
    name: Cross-compile all release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target
        run: bash scripts/build-release.sh dev
      - uses: actions/upload-artifact@v4
        with:
          name: dev-binaries
          path: dist/
